    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://api.xposed.info/' }
        maven { url = 'https://artifactory.appodeal.com/appodeal-public/' }
    }
}
rootProject.name = 'BLE-M3-Fixer'
include ':app'
