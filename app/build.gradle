plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android { namespace 'com.example.blem3fixer'; compileSdk 35
    defaultConfig { applicationId 'com.example.blem3fixer'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
