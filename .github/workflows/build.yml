name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Download Android NDK
        run: |
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            --output "$RUNNER_TEMP/android-ndk.zip"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r27d" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Download Xposed API 82
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            https://repository-cdn.liferay.com/nexus/content/repositories/gradle-plugins/de/robv/android/xposed/api/82/api-82.jar \
            --output app/libs/api-82.jar
      - run: gradle assembleRelease --stacktrace --warning-mode all
      - name: Build Magisk module (arm64-v8a)
        run: |
          cmake -S magisk -B magisk/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK_HOME" \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_API=26
          cmake --build magisk/build
          mkdir -p magisk/module/bin
          cp magisk/build/ble-m3-remapper magisk/module/bin/
          chmod 0700 magisk/module/bin/ble-m3-remapper magisk/module/service.sh magisk/module/post-fs-data.sh
          (cd magisk/module && zip -r ../../BLE-M3-Center-Key-Remapper-magisk.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: ble-m3-fixer
          path: |
            app/build/outputs/apk/release/*.apk
            BLE-M3-Center-Key-Remapper-magisk.zip
